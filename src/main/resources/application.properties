# ---------- Base de datos ----------
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/labmedic
quarkus.datasource.username=postgres
quarkus.datasource.password=postgres

# Hibernate NUNCA toca el esquema: lo manejas tu con los scripts SQL
quarkus.hibernate-orm.database.generation=none
quarkus.hibernate-orm.database.default-schema=lab
%dev.quarkus.hibernate-orm.log.sql=true

# ---------- HTTP ----------
quarkus.http.port=8080
quarkus.http.limits.max-body-size=20M
%dev.quarkus.http.cors.enabled=true
%dev.quarkus.http.cors.origins=http://localhost:5173

# ---------- Labmedic ----------
# Carpeta raiz donde se guardan plantillas (.docx) y documentos generados (.pdf).
# En produccion apunta a la carpeta compartida de red, ej: Z:/labmedic o //servidor/labmedic
labmedic.storage.root=./data

# Ruta al ejecutable de LibreOffice
# Linux/Mac: soffice
# Windows:   C:/Program Files/LibreOffice/program/soffice.exe
labmedic.libreoffice.path=soffice
